# pnpm settings (pnpm 11+ reads only auth and registry settings from .npmrc).

# Dependencies with install scripts must be allowed or denied explicitly.
# Neither script is needed: esbuild's postinstall only validates and
# optimizes the binary that its platform package already provides, and
# @parcel/watcher (via sass) ships prebuilt binaries the same way.
allowBuilds:
  esbuild: false
  "@parcel/watcher": false

# Refuse any version published less than 7 days ago (the value is in minutes).
# Compromised npm publishes are typically caught and pulled within a day or
# two, so a cooldown means such a version is never resolved here. It applies
# when the lockfile changes; `pnpm install --frozen-lockfile` is unaffected.
minimumReleaseAge: 10080
