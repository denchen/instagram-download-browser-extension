<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1,user-scalable=0" />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <main class="container">
      <header>
        <img class="logo" src="../icons/icon-32.png" width="20" height="20" alt="" />
        <h1>Instagram Downloader</h1>
        <span class="version" id="version"></span>
        <a
          class="github"
          target="_blank"
          rel="noopener noreferrer"
          href="https://github.com/denchen/instagram-download-browser-extension"
          title="Source code on GitHub"
          aria-label="Source code on GitHub"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            ></path>
          </svg>
        </a>
      </header>

      <section>
        <h2>Buttons on posts</h2>
        <div class="group">
          <label class="setting">
            <span class="text">Open in new tab</span>
            <input type="checkbox" role="switch" id="setting_show_open_in_new_tab_icon" />
          </label>
          <label class="setting">
            <span class="text">Download all</span>
            <input type="checkbox" role="switch" id="setting_show_download_all_icon" />
          </label>
        </div>
      </section>

      <section>
        <h2>Video</h2>
        <div class="group">
          <label class="setting">
            <span class="text">Browser video controls</span>
            <input type="checkbox" role="switch" id="setting_enable_video_controls" />
          </label>
          <label class="setting">
            <span class="text">
              Highest quality
              <small>
                Up to 1440p in VP9, which QuickTime and Apple Photos can't play. Off saves
                Instagram's 720p H.264, which plays everywhere.
              </small>
            </span>
            <input type="checkbox" role="switch" id="setting_video_highest_quality" />
          </label>
        </div>
      </section>

      <section>
        <h2>Threads</h2>
        <div class="group">
          <label class="setting">
            <span class="text">Download on threads.com</span>
            <input type="checkbox" role="switch" id="setting_enable_threads" />
          </label>
        </div>
      </section>

      <footer>
        Saved as <code>@username/[type - ]YYYY.MM.DDTHH.mm.ss[ NN].ext</code> (UTC), one file per
        item.
      </footer>
    </main>
    <script src="./index.js" type="module"></script>
  </body>
</html>
