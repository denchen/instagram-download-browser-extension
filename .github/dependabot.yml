# Keeps the pinned action SHAs and npm dependencies current. devDependencies
# land as one weekly PR; mediabunny ships in the bundle, so it gets its own. CI
# is the gate, and nothing is auto-merged. minimumReleaseAge in
# pnpm-workspace.yaml still applies to what Dependabot proposes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-toolchain:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
